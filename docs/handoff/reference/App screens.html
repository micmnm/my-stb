<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MyStb · App screens</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const Frame = ({ children, dark }) => (
  <IOSDevice width={402} height={874} dark={dark}>{children}</IOSDevice>
);

// Build artboards as a flat array of elements (not via a wrapper) so they
// satisfy DCSection's `c.type === DCArtboard` filter.
const pair = (idPrefix, Comp) => [
  <DCArtboard key={`${idPrefix}-l`} id={`${idPrefix}-light`} label="Light" width={402} height={874}>
    <Frame dark={false}><Comp dark={false}/></Frame>
  </DCArtboard>,
  <DCArtboard key={`${idPrefix}-d`} id={`${idPrefix}-dark`} label="Dark" width={402} height={874}>
    <Frame dark={true}><Comp dark={true}/></Frame>
  </DCArtboard>,
];

const App = () => (
  <DesignCanvas>
    <DCSection id="home" title="Home" subtitle="D = chosen hybrid (map + draggable POI sheet at MID). A/B/C kept for compare.">
      {pair('home-d', HomeD)}
      {pair('home-a', HomeA)}
      {pair('home-b', HomeB)}
      {pair('home-c', HomeC)}
    </DCSection>

    <DCSection id="search" title="Search" subtitle="Fullscreen modal opened from Home pill — typing & empty states (after-22:00 night prompt variant)">
      {pair('search-a', SearchA)}
      {pair('search-b', SearchB)}
      <DCArtboard id="search-night-light" label="Night prompt · Light" width={402} height={874}>
        <IOSDevice width={402} height={874} dark={false}><SearchB dark={false} afterTen={true}/></IOSDevice>
      </DCArtboard>
      <DCArtboard id="search-night-dark" label="Night prompt · Dark" width={402} height={874}>
        <IOSDevice width={402} height={874} dark={true}><SearchB dark={true} afterTen={true}/></IOSDevice>
      </DCArtboard>
    </DCSection>

    <DCSection id="stop" title="Stop & Route detail" subtitle="Final per Q1-Q9 decisions: ETA order, two-way rows, inline expand, walk time, all-vehicles schematic, top alert banner, etc.">
      {pair('stop-a', StopDetailA)}
      {pair('route-b', RouteDetailB)}
    </DCSection>

    <DCSection id="plan" title="Plan a trip" subtitle="From → to results, then step-by-step">
      {pair('plan-a', PlanA)}
      {pair('plan-b', PlanB)}
    </DCSection>

    <DCSection id="saved" title="Saved" subtitle="Stops with nicknames; routes & trips sub-tabs">
      {pair('saved-a', SavedA)}
      {pair('saved-b', SavedB)}
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
