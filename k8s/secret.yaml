# Create this secret manually — DO NOT commit with real values:
#   kubectl create secret generic my-stb-secrets \
#     --from-literal=api-key=YOUR_RANDOM_KEY_HERE \
#     -n mltru-com
#
# Or apply this template after filling in the base64-encoded value:
apiVersion: v1
kind: Secret
metadata:
  name: my-stb-secrets
  namespace: mltru-com
type: Opaque
data:
  api-key: ""  # echo -n 'your-key' | base64
